name: Workspace validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workspace:
    name: Validate workspace configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate VS Code workspace configuration
        run: node scripts/validate-workspace-config.js

      - name: Validate Pawn architecture dependencies
        run: node scripts/check-pawn-architecture.js

      - name: Run architecture tests
        run: node --test tests/architecture.test.js
